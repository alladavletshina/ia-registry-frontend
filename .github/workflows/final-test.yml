# .github/workflows/final-test.yml
name: Final SSH Test

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test the new key
        run: |
          mkdir -p ~/.ssh
          
          # 1. Сохраняем ключ ТОЧНО как в секретах
          cat > ~/.ssh/test_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          
          # 2. Проверяем что сохранили
          echo "=== First 3 lines of key ==="
          head -3 ~/.ssh/test_key
          echo "=== Last 3 lines of key ==="
          tail -3 ~/.ssh/test_key
          
          # 3. Проверяем валидность
          chmod 600 ~/.ssh/test_key
          echo "=== Checking key ==="
          ssh-keygen -l -f ~/.ssh/test_key
          
          # 4. Тестируем подключение
          echo "=== Testing connection ==="
          ssh -i ~/.ssh/test_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "echo '🎉 SUCCESS! Connected to:'; hostname; echo 'Time:'; date"