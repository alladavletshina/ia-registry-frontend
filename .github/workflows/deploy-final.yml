# .github/workflows/deploy-final.yml
name: 🚀 Deploy React App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install && CI=false npm run build

      - name: Setup SSH with NEW key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          echo "Deploying to ${{ secrets.SERVER_HOST }}..."
          scp -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -r build/ \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/u3391852/data/www/myiam.ru/
          
          echo "✅ Files uploaded"

      - name: Set permissions
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "cd /var/www/u3391852/data/www/myiam.ru && \
               chmod -R 755 . && \
               find . -type f -exec chmod 644 {} \; && \
               echo '✅ Deployment complete at \$(date)'"