name: Simple Deploy

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install && CI=false npm run build

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          # Просто сохраняем как есть
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          
          # Тест
          ssh -i ~/.ssh/key \
              -o StrictHostKeyChecking=no \
              -v \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "echo test" 2>&1 | tail -20

      - name: Upload files with SCP
        run: |
          # Загружаем по одному файлу
          scp -i ~/.ssh/key \
              -o StrictHostKeyChecking=no \
              build/index.html \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/u3391852/data/www/myiam.ru/
          
          echo "✅ index.html uploaded"