# .github/workflows/deploy-ftp.yml
name: Deploy via FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install && CI=false npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.myiam.ru  # или что-то вроде server67.timeweb.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/
          server-dir: /www/myiam.ru/
          exclude: |
            **/.git*
            **/.git*/
            **/node_modules/
          dangerous-clean-slate: false

      - name: 🔧 Clear browser cache hint
        run: |
          echo "🌐 Ссылка для принудительной перезагрузки:"
          echo "https://myiam.ru?cb=$(date +%s)"
          echo ""
          echo "📋 Инструкция:"
          echo "1. Откройте ссылку выше"
          echo "2. Или откройте сайт в режиме инкогнито (Ctrl+Shift+N)"
          echo "3. Или нажмите Ctrl+F5 на странице"
          echo ""
          echo "✅ Деплой завершен в $(date)"