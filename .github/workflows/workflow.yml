# .github/workflows/deploy-with-cache-clear.yml
name: 🚀 Deploy with Cache Clear

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install && CI=false npm run build

      # 🔥 ДОБАВЛЯЕМ anti-cache метатеги
      - name: 🔧 Add cache control headers
        run: |
          # Добавляем метатеги для отключения кэша
          sed -i '/<head>/a\
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\
          <meta http-equiv="Pragma" content="no-cache">\
          <meta http-equiv="Expires" content="0">' build/index.html
          
          # Добавляем версию в query string для JS/CSS файлов
          VERSION=$(date +%s)
          sed -i "s/\(\.js\|\.css\)\"/\1?v=$VERSION\"/g" build/index.html
          
          echo "✅ Anti-cache headers added"

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /var/www/u3391852/data/www/myiam.ru/
          local-dir: ./build/
          dangerous-clean-slate: false

      # 🔥 ДОБАВЛЯЕМ очистку кэша на сервере
      - name: 🧹 Clear server cache via SSH
        env:
          SSH_PASS: z8CG8z52iPrdTP9j
        run: |
          sudo apt-get install -y sshpass
          
          sshpass -p "$SSH_PASS" \
            ssh -o StrictHostKeyChecking=no \
            u3391852@37.140.192.212 "
              echo '🧹 Очищаю кэш...'
          
              # 1. Принудительно обновляем timestamp
              touch /var/www/u3391852/data/www/myiam.ru/index.html
          
              # 2. Очищаем PHP кэш если есть
              php -r 'if (function_exists(\"opcache_reset\")) { opcache_reset(); echo \"✅ PHP cache cleared\"; }' 2>/dev/null || true
          
              # 3. Ищем и очищаем кэш веб-сервера
              find /tmp -name '*cache*' -type d -exec rm -rf {} \; 2>/dev/null || true
              find /var/cache -name '*nginx*' -exec rm -rf {} \; 2>/dev/null || true
          
              # 4. Перезагружаем nginx если доступно
              nginx -s reload 2>/dev/null || echo '⚠️ Nginx reload not available'
          
              echo '✅ Кэш очищен: \$(date)'
            "