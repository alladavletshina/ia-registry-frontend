name: 🚀 Deploy React App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ← ОБЯЗАТЕЛЬНО 20+
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build project (ignore ESLint errors)
        run: CI=false npm run build  # ← ВАЖНО: отключаем ESLint ошибки в CI

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Upload files
        run: |
          echo "Uploading to ${{ secrets.SERVER_HOST }}..."
          rsync -avz \
            --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/u3391852/data/www/myiam.ru/

      - name: 🔧 Fix permissions
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "cd /var/www/u3391852/data/www/myiam.ru && \
               find . -type d -exec chmod 755 {} \; && \
               find . -type f -exec chmod 644 {} \; && \
               echo '✅ Deployment done: \$(date)'"