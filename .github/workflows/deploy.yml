name: 🚀 Deploy React App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install & Build
        run: |
          npm install
          CI=false npm run build

      - name: 🔐 Fix SSH Key Format
        run: |
          mkdir -p ~/.ssh
          
          # 1. Сохраняем ключ ОЧИЩЕННЫЙ от лишних символов
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/raw_key
          
          # 2. Удаляем пустые строки в начале/конце
          sed -i '/^$/d' ~/.ssh/raw_key
          sed -i '1{/^$/d;}' ~/.ssh/raw_key
          sed -i '${/^$/d;}' ~/.ssh/raw_key
          
          # 3. Проверяем формат
          echo "=== Key format check ==="
          head -2 ~/.ssh/raw_key
          echo "..."
          tail -2 ~/.ssh/raw_key
          
          # 4. Проверяем валидность ключа
          if ssh-keygen -l -f ~/.ssh/raw_key 2>/dev/null; then
            echo "✅ Key is valid"
            cp ~/.ssh/raw_key ~/.ssh/deploy_key
          else
            echo "❌ Key is invalid. Showing first 100 chars:"
            head -c 100 ~/.ssh/raw_key
            exit 1
          fi
          
          chmod 600 ~/.ssh/deploy_key
          
          # 5. Добавляем хост в known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🧪 Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          timeout 10 ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "echo '✅ SSH test successful'; whoami; pwd" \
              && echo "✅ Connection test passed" || echo "❌ Connection test failed"

      - name: 📤 Deploy with Rsync
        run: |
          echo "Deploying files..."
          rsync -avz \
            --progress \
            --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/u3391852/data/www/myiam.ru/

      - name: 🔧 Set Permissions
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "cd /var/www/u3391852/data/www/myiam.ru && \
               find . -type d -exec chmod 755 {} \; && \
               find . -type f -exec chmod 644 {} \; && \
               echo '✅ Permissions set at \$(date)'"

      - name: ✅ Verify
        run: |
          echo "🎉 Deployment completed!"
          echo "🌐 Site: https://myiam.ru"
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://myiam.ru || true