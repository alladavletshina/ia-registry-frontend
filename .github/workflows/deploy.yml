name: 🚀 Deploy React App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Таймаут на случай проблем

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Только последний коммит для скорости

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci  # Используем ci вместо install для надежности
        env:
          CI: true

      - name: 🏗️ Build project
        run: npm run build
        env:
          CI: false  # Отключаем строгие проверки только для сборки
          NODE_ENV: production
          GENERATE_SOURCEMAP: false  # Убираем source maps для уменьшения размера

      - name: 🧪 Validate build
        run: |
          echo "=== Проверка сборки ==="
          if [ ! -d "build" ]; then
            echo "❌ Папка build не создана!"
            exit 1
          fi
          
          if [ ! -f "build/index.html" ]; then
            echo "❌ index.html не найден!"
            exit 1
          fi
          
          echo "✅ Сборка успешна:"
          ls -la build/ | head -10
          echo "Размер сборки: $(du -sh build/)"

      - name: 🔐 Setup SSH
        run: |
          echo "Настройка SSH подключения..."
          mkdir -p ~/.ssh
          
          # Создаем приватный ключ
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Добавляем хост в known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Тестируем подключение
          echo "Тестируем SSH подключение..."
          if ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo '✅ SSH подключение успешно'"; then
            echo "SSH подключение работает!"
          else
            echo "❌ Ошибка SSH подключения"
            exit 1
          fi

      - name: 📦 Создать бэкап на сервере
        run: |
          echo "Создаю бэкап текущей версии..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            # Создаем бэкап
            BACKUP_DIR=\"/var/www/u3391852/data/www/myiam.ru-backup-\$(date +%Y%m%d-%H%M%S)\"
            if [ -d \"/var/www/u3391852/data/www/myiam.ru\" ]; then
              cp -r \"/var/www/u3391852/data/www/myiam.ru\" \"\$BACKUP_DIR\"
              echo \"✅ Бэкап создан: \$BACKUP_DIR\"
          
              # Оставляем только последние 5 бэкапов
              find /var/www/u3391852/data/www -maxdepth 1 -name 'myiam.ru-backup-*' -type d | sort -r | tail -n +6 | xargs rm -rf 2>/dev/null || true
            else
              echo \"⚠️ Целевая директория не существует, создаем новую\"
            fi
          "

      - name: 📤 Загрузить файлы через rsync
        run: |
          echo "Начинаю загрузку файлов..."
          
          # Создаем временную директорию на сервере
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            rm -rf /tmp/myiam_deploy 2>/dev/null || true
            mkdir -p /tmp/myiam_deploy
          "
          
          # Копируем файлы во временную директорию
          rsync -avz \
            --progress \
            --delete \
            --exclude='.git*' \
            --exclude='*.log' \
            --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/myiam_deploy/
          
          echo "✅ Файлы загружены во временную директорию"

      - name: 🚀 Атомарный деплой
        run: |
          echo "Выполняю атомарное обновление..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            # Создаем целевую директорию если нет
            mkdir -p /var/www/u3391852/data/www/myiam.ru
          
            # Атомарная замена (минимальное время простоя)
            echo '🔄 Синхронизация файлов...'
            rsync -a --delete /tmp/myiam_deploy/ /var/www/u3391852/data/www/myiam.ru/
          
            # Очищаем временную директорию
            rm -rf /tmp/myiam_deploy
          
            echo '✅ Файлы синхронизированы'
          "

      - name: 🔧 Настроить права и очистить кэш
        run: |
          echo "Настраиваю права и очищаю кэш..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            # Устанавливаем правильные права
            echo '🛠️ Настройка прав доступа...'
            cd /var/www/u3391852/data/www/myiam.ru
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
          
            # Очищаем кэш PHP если есть
            echo '🧹 Очистка кэша...'
            if command -v php > /dev/null 2>&1; then
              php -r \"if (function_exists('opcache_reset')) { opcache_reset(); echo '✅ PHP opcache очищен'; }\" 2>/dev/null || true
            fi
          
            # Создаем файл версии
            echo \"{\\\"version\\\": \\\"${{ github.sha }}\\\", \\\"date\\\": \\\"$(date -Iseconds)\\\", \\\"build\\\": \\\"${{ github.run_id }}\\\"}\" > version.json
          
            echo '✅ Права и кэш настроены'
          "

      - name: ✅ Проверить деплой
        run: |
          echo "Проверяю результат деплоя..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo '=== ИТОГИ ДЕПЛОЯ ==='
            echo '📁 Директория: /var/www/u3391852/data/www/myiam.ru'
            echo '📄 Файлов: \$(find /var/www/u3391852/data/www/myiam.ru -type f | wc -l)'
            echo '💾 Размер: \$(du -sh /var/www/u3391852/data/www/myiam.ru | cut -f1)'
            echo '🕐 Время: \$(date)'
            echo '🔧 Версия: \$(cat /var/www/u3391852/data/www/myiam.ru/version.json 2>/dev/null || echo \"не определена\")'
            echo ''
            echo '🌐 Сайт должен быть доступен по адресу:'
            echo 'https://myiam.ru'
            echo ''
          
            # Быстрая проверка доступности
            echo '🔍 Проверка доступности...'
            if curl -s -o /dev/null -w \"%{http_code}\" https://myiam.ru 2>/dev/null | grep -q \"200\|301\|302\"; then
              echo '✅ Сайт отвечает'
            else
              echo '⚠️ Сайт может быть недоступен (проверьте вручную)'
            fi
          "

      - name: 📢 Уведомление об успехе
        if: success()
        run: |
          echo '🎉 Деплой успешно завершен!'
          echo 'Сайт: https://myiam.ru'
          echo 'Коммит: ${{ github.sha }}'
          echo 'Запуск: ${{ github.run_id }}'

      - name: 🚨 Уведомление об ошибке
        if: failure()
        run: |
          echo '❌ Деплой завершился с ошибкой!'
          echo 'Проверьте логи выше для деталей.'
          echo 'Коммит: ${{ github.sha }}'
          echo 'Запуск: ${{ github.run_id }}'